[project]
name = "async-sdpo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=3.0",
    "loguru>=0.7.3",
    "numpy>=2.5.1",
    "omegaconf>=2.3.1",
    "pytest>=8.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0.3",
    "requests>=2.32",
    "rubric==2.2.0",
    "torch>=2.4",
    "torchdata>=0.11.0",
    "transformers>=4.45",
    "wandb>=0.19",
]

[project.optional-dependencies]
# Core tau2 (retail / airline / mock). No retrieval, no sandbox.
tau2 = [
    "tau2 @ git+https://github.com/sierra-research/tau2-bench.git",
]
# Banking_knowledge: BM25 + OpenRouter dense embeddings (qwen3-embedding-8b).
# The shell tool also needs host binaries -- see scripts/setup_tau2_sandbox.sh.
knowledge = [
    "tau2[knowledge] @ git+https://github.com/sierra-research/tau2-bench.git",
]
