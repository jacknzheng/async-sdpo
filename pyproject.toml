[project]
name = "async-sdpo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=3.0",
    "loguru>=0.7.3",
    "numpy>=2.5.1",
    "omegaconf>=2.3.1",
    "pytest>=8.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0.3",
    "requests>=2.32",
    "rubric==2.2.0",
    # 2.13 on PyPI is CUDA 13 and will not load on a 12.8 driver (A100 / driver 570).
    # 2.11.0 is also what vLLM 0.26.0 requires. The cu128 index is set below.
    "torch==2.11.0",
    "torchdata>=0.11.0",
    "transformers>=4.45",
    "wandb>=0.19",
]

[project.optional-dependencies]
# Core tau2 (retail / airline / mock). No retrieval, no sandbox.
tau2 = [
    "tau2 @ git+https://github.com/sierra-research/tau2-bench.git",
]
# Banking_knowledge: BM25 + OpenRouter dense embeddings (qwen3-embedding-8b).
# The shell tool also needs host binaries -- see scripts/setup_tau2_sandbox.sh.
knowledge = [
    "tau2[knowledge] @ git+https://github.com/sierra-research/tau2-bench.git",
]

# Keep torch on the CUDA 12.8 wheels. Default PyPI torch 2.13 pulls nvidia-*-cu13
# and fails on this driver with "NVIDIA driver is too old" / ncclCommResume.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
